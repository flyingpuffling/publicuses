<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>영상 대사 퀴즈</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .quiz-container {
      width: 92%;
      max-width: 1100px;
      text-align: center;
      padding: 28px 0;
    }

    .counter {
      text-align: right;
      color: #aaa;
      margin-bottom: 10px;
      font-size: 1.05rem;
    }

    .video-container {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: black;
      overflow: hidden;
      position: relative;
    }

    /* Crop the YouTube iframe itself so YouTube's title/channel strip
       and bottom branding sit outside the visible quiz window. */
    #player {
      position: absolute;
      width: 112%;
      height: 126%;
      left: -6%;
      top: -13%;
    }

    .video-cover {
      position: absolute;
      inset: 0;
      z-index: 10;
      background: black;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .video-cover.hidden {
      display: none;
    }

    .video-cover img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      background: black;
    }

    .quote {
      min-height: 76px;
      margin-top: 22px;
      font-size: 2rem;
      font-weight: bold;
      line-height: 1.45;
      display: flex;
      justify-content: center;
      align-items: center;
      visibility: hidden;
    }

    .source {
      min-height: 28px;
      margin-top: 7px;
      color: #aaa;
      font-size: 1.05rem;
      visibility: hidden;
    }

    .controls {
      margin-top: 24px;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    button {
      padding: 12px 20px;
      font-size: 1rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover { opacity: 0.8; }

    .primary {
      background: white;
      color: black;
    }

    .secondary {
      background: #333;
      color: white;
    }

    .next {
      background: #666;
      color: white;
    }
  </style>
</head>

<body>
  <div class="quiz-container">

    <div class="counter">
      <span id="current-number">1</span> /
      <span id="total-number">0</span>
    </div>

    <div id="video-container" class="video-container">
      <div id="player"></div>

      <div id="video-cover" class="video-cover">
        <img id="cover-image" src="" alt="문제 장면">
      </div>
    </div>

    <div id="quote" class="quote"></div>
    <div id="source" class="source"></div>

    <div class="controls">
      <button class="primary" onclick="playMuted()">▶ 무음으로 재생</button>
      <button class="secondary" onclick="replayMuted()">↻ 다시 재생</button>
      <button class="secondary" onclick="showQuote()">대사 공개</button>
      <button class="primary" onclick="playWithSound()">🔊 소리와 함께 재생</button>
      <button class="next" onclick="nextQuestion()">다음 →</button>
    </div>

  </div>

  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    const questions = [
      {
        videoId: "qHRF1an9ygs",
        thumbnail: "thumbnails/01.jpg",
        start: 0,
        end: 14,
        quote: "이러다가는 다 죽어",
        source: "오징어게임",
        character: "오일남"
      },
      {
        videoId: "UJZqS8dyUA8",
        thumbnail: "thumbnails/02.jpg",
        start: 204,
        end: 285,
        quote: "애기야 가자!",
        source: "파리의 연인",
        character: "한기주"
      },
      {
        videoId: "pQpHe9S1oLk",
        thumbnail: "thumbnails/03.jpg",
        start: 0,
        end: 30,
        quote: "너와 함께한 시간 모두 눈부셨다. 날이 좋아서, 날이 좋지 않아서, 날이 적당해서, 모든 날이 좋았다.",
        source: "도깨비",
        character: ""
      },
      {
        videoId: "sycCLllS9qs",
        thumbnail: "thumbnails/04.jpg",
        start: 93,
        end: 115,
        quote: "사랑에 빠진 게 죄는 아니잖아!",
        source: "부부의 세계",
        character: "이태오"
      },
      {
        videoId: "bjOShto2gJA",
        thumbnail: "thumbnails/05.jpg",
        start: 0,
        end: null,
        quote: "날 추앙해요",
        source: "나의 해방일지",
        character: "염미정"
      },
      {
        videoId: "QzjqVxML3zc",
        thumbnail: "thumbnails/06.jpg",
        start: 0,
        end: null,
        quote: "이게 최선입니까? 확실해요?",
        source: "시크릿 가든",
        character: "김주원"
      },
      {
        videoId: "FtTlD6uWBWY",
        thumbnail: "thumbnails/07.jpg",
        start: 96,
        end: 103,
        quote: "우린 아직 다 미생이야.",
        source: "미생",
        character: "오상식",
        cropTop: true
      },
      {
        videoId: "buCg8rThVfo",
        thumbnail: "thumbnails/08.jpg",
        start: 4,
        end: 11,
        quote: "살려는 드릴게",
        source: "신세계",
        character: "이중구"
      },
      {
        videoId: "fSf05ZftFNw",
        thumbnail: "thumbnails/09.jpg",
        start: 130,
        end: 145,
        quote: "뭐 타는 냄새 안 나요? 내 마음이 지금 불타고 있잖아요.",
        source: "불새",
        character: "서정민"
      },
      {
        videoId: "mPsAQ8e1bmA",
        thumbnail: "thumbnails/10.jpg",
        start: 822,
        end: 836,
        quote: "홍시맛이 났는데 어찌 홍시라 생각했느냐 하시면 그냥 홍시맛이 나서 홍시라 생각한 것인데",
        source: "대장금",
        character: "장금이"
      }
    ];

    let player;
    let currentQuestion = 0;
    let stopTimer;

    const cover = document.getElementById("video-cover");
    const coverImage = document.getElementById("cover-image");

    document.getElementById("total-number").textContent = questions.length;

    function onYouTubeIframeAPIReady() {
      player = new YT.Player("player", {
        height: "100%",
        width: "100%",
        videoId: questions[0].videoId,
        playerVars: {
          controls: 0,
          disablekb: 1,
          rel: 0,
          playsinline: 1
        },
        events: {
          onReady: loadQuestion,
          onStateChange: function(event) {
            if (event.data === YT.PlayerState.ENDED) {
              showCover();
            }
          }
        }
      });
    }

    function showCover() {
      cover.classList.remove("hidden");
    }

    function hideCover() {
      cover.classList.add("hidden");
    }

    function loadQuestion() {
      clearTimeout(stopTimer);

      const q = questions[currentQuestion];

      document.getElementById("current-number").textContent = currentQuestion + 1;
      document.getElementById("quote").textContent = q.quote;
      document.getElementById("source").textContent =
        q.character ? `${q.source} · ${q.character}` : q.source;

      document.getElementById("quote").style.visibility = "hidden";
      document.getElementById("source").style.visibility = "hidden";

      const container = document.getElementById("video-container");
      container.classList.toggle("crop-top", !!q.cropTop);

      coverImage.src = q.thumbnail;
      showCover();

      player.cueVideoById({
        videoId: q.videoId,
        startSeconds: q.start
      });
    }

    function playSegment(soundOn) {
      clearTimeout(stopTimer);

      const q = questions[currentQuestion];

      hideCover();
      player.seekTo(q.start, true);

      if (soundOn) {
        player.unMute();
      } else {
        player.mute();
      }

      player.playVideo();

      if (q.end !== null && q.end !== undefined) {
        const duration = Math.max(0, (q.end - q.start) * 1000);

        stopTimer = setTimeout(function() {
          player.pauseVideo();
          showCover();
        }, duration);
      }
    }

    function playMuted() {
      playSegment(false);
    }

    function replayMuted() {
      playSegment(false);
    }

    function showQuote() {
      document.getElementById("quote").style.visibility = "visible";
      document.getElementById("source").style.visibility = "visible";
    }

    function playWithSound() {
      showQuote();
      playSegment(true);
    }

    function nextQuestion() {
      if (currentQuestion < questions.length - 1) {
        currentQuestion++;
        loadQuestion();
      } else {
        alert("마지막 문제입니다.");
      }
    }
  </script>
</body>
</html>
